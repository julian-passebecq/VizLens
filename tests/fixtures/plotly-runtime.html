<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Plotly runtime fixture</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#fff;color:#202124}main{max-width:760px;margin:auto;padding:32px}.js-plotly-plot{width:640px;height:360px;border:1px solid #ddd;position:relative}svg{width:640px;height:360px}</style></head><body><main><article><h1>Monthly traffic trend</h1><p>Traffic increased from 120 users in January to 210 users in March.</p><figure><div id="plot" class="js-plotly-plot" aria-label="Monthly traffic line chart"><svg viewBox="0 0 640 360" aria-hidden="true"><path d="M60 280 L300 180 L560 100" fill="none" stroke="#0078d4" stroke-width="3"></path></svg></div><figcaption>Monthly users</figcaption></figure></article></main><script>const plot=document.getElementById('plot');plot.data=[{type:'scatter',mode:'lines+markers',name:'Users',x:['2026-01','2026-02','2026-03'],y:[120,165,210]}];plot.layout={title:{text:'Monthly traffic'},xaxis:{title:'Month'},yaxis:{title:'Users'}};</script></body></html>
