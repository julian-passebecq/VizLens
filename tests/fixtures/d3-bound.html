<!doctype html><html lang="en"><head><meta charset="utf-8"><title>D3-style bound data fixture</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#fff;color:#202124}main{max-width:760px;margin:auto;padding:32px}svg{display:block;width:640px;height:320px;border:1px solid #ddd}</style></head><body><main><article><h1>Quarterly revenue chart</h1><p>Revenue increased from USD 10 million in Q1 to USD 40 million in Q4.</p><figure><svg id="revenue-chart" viewBox="0 0 640 320" aria-label="Quarterly revenue"><g id="bars"></g><text x="20" y="28">Quarterly revenue</text></svg><figcaption>Revenue by quarter in USD millions</figcaption></figure></article></main><script>const rows=[{quarter:'Q1',revenue:10},{quarter:'Q2',revenue:20},{quarter:'Q3',revenue:30},{quarter:'Q4',revenue:40}];const group=document.getElementById('bars');rows.forEach((row,index)=>{const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',String(70+index*130));rect.setAttribute('y',String(270-row.revenue*5));rect.setAttribute('width','80');rect.setAttribute('height',String(row.revenue*5));rect.setAttribute('fill','#5b5fc7');rect.__data__=row;group.appendChild(rect);});</script></body></html>
